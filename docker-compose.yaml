version: '3.9'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: alexiane
      POSTGRES_PASSWORD: alexiane
      POSTGRES_DB: leitmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python main.py
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      - db

volumes:
  postgres_data:
    